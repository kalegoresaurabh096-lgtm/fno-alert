name: Fund house small cap buys

# Fund houses publish every scheme's full portfolio by the 10th of the next month.
# This checks each day from the 1st to the 15th, reads any newly published month,
# and emails the small cap stocks a fund house holds now but held in no scheme last month.
on:
  schedule:
    - cron: "30 13 1-15 * *"   # 19:00 IST, 1st to 15th of each month
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the findings instead of emailing and saving them"
        type: boolean
        default: false
      resend_last:
        description: "Email the most recent alert again instead of checking for new portfolios"
        type: boolean
        default: false

concurrency:
  group: mfwatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mfwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resend the most recent alert
        if: inputs.resend_last
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m fno_alert mfwatch --resend-last ${{ inputs.dry_run && '--dry-run' || '' }}
      - if: ${{ !inputs.resend_last }}
        run: python -m playwright install --with-deps chromium
      - name: Read new portfolios and email new small cap positions
        if: ${{ !inputs.resend_last }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m fno_alert mfwatch ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save state back to the repo
        if: always() && !inputs.dry_run && !inputs.resend_last
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "fno-alert-bot@users.noreply.github.com"
          git add state/mfwatch || true
          git diff --cached --quiet || git commit -m "mfwatch state $(date -u +%F_%H%M)"
          git push || (git pull --rebase && git push)
