name: Fund portfolio probe

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-wta1qs]
    paths: [fno_alert/mfwatch.py, fno_alert/mfsources.py, .github/workflows/mf-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: MFWATCH_DEBUG=1 python -m fno_alert mfwatch --dry-run --state /tmp/mfstate
