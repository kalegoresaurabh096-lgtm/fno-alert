name: Fund portfolio probe

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-wta1qs]
    paths: [scripts/mf_probe.py, .github/workflows/mf-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/mf_probe.py
