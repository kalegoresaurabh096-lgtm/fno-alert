name: Momentum portfolio

# Daily momentum paper portfolio and monthly picks email, run on its own now
# that the full F&O scan (scan.yml) is switched off.
on:
  # Schedule switched off 2026-11-10 at the user's request. Can still be run by hand.
  # schedule:
  #  - cron: "5 5 * * 1-5"    # 10:35 IST: fill pending orders at today's open
  #  - cron: "20 10 * * 1-5"  # 15:50 IST: save closing prices, mark, monthly rebalance
  workflow_dispatch:

concurrency:
  group: fno-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update momentum portfolio
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m fno_alert momentum
      - name: Save state back to the repo
        if: always()
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "fno-alert-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "momentum state $(date -u +%F_%H%M)"
          git push || (git pull --rebase && git push)
