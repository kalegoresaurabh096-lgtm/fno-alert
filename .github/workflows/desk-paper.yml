name: Desk paper trading

# Runs the multi-strategy desk (fno_alert/desk/) on live Upstox prices every trading
# day, paper only: no orders are ever sent from this workflow.
# A GitHub job may run at most 6 hours, so the day is split in two jobs that hand
# over through state/desk/paper/ (open positions are saved after every change):
#   09:20 IST  first job, stops at 14:30
#   14:20 IST  second job, waits for the first to finish, runs until 15:31
#              (the condor is entered and closed at 15:20)

on:
  schedule:
    - cron: "50 3 * * 1-5"   # 09:20 IST
    - cron: "50 8 * * 1-5"   # 14:20 IST
  workflow_dispatch:
    inputs:
      resume:
        description: "Clear a monthly or strategy pause (after you have reviewed it)"
        type: boolean
        default: false

concurrency:
  group: desk-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resume the desk by hand
        if: ${{ inputs.resume }}
        run: python -m fno_alert.desk.live --resume
      - name: Paper trade
        if: ${{ !inputs.resume }}
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          git pull -q --rebase || true
          ( while sleep 600; do bash .github/save-state.sh "desk paper" || true; done ) &
          # the morning job hands over at 14:30; later jobs run to the close
          H=$(TZ=Asia/Kolkata date +%H)
          if [ "$H" -lt 14 ]; then UNTIL="--until 14:30"; else UNTIL=""; fi
          python -m fno_alert.desk.live --mode paper $UNTIL
      - name: Save state
        if: always()
        run: bash .github/save-state.sh "desk paper"
