name: F&O scan

on:
  schedule:
    # GitHub cron is UTC (IST = UTC+5:30). Runs can start 5-20 minutes late.
    - cron: "0 5 * * 1-5"    # 10:30 IST  intraday
    - cron: "0 7 * * 1-5"    # 12:30 IST  intraday
    - cron: "15 9 * * 1-5"   # 14:45 IST  intraday, still time to act before the close
    - cron: "15 10 * * 1-5"  # 15:45 IST  end of day (the backtested signal)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | intraday | eod"
        default: "auto"
      dry_run:
        description: "true = do not email or save state"
        default: "false"

concurrency:
  group: fno-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and email
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          ARGS="--mode ${{ github.event.inputs.mode || 'auto' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m fno_alert scan $ARGS
      - name: Save history (state/) back to the repo
        if: always()
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "fno-alert-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || git commit -m "scan state $(date -u +%F_%H%M)"
          git push || (git pull --rebase && git push)
