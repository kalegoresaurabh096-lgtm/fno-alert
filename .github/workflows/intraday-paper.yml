name: Intraday paper trading

# Runs the intraday selling rules on live Upstox prices every trading day, paper only:
# no orders are ever sent from this workflow. Emails each entry, exit and skipped setup.
# State (open position, trades, days) is saved to state/intraday/paper/ in the repo.

on:
  schedule:
    - cron: "50 3 * * 1-5"   # 09:20 IST: main run, until 15:20 IST
    - cron: "30 6 * * 1-5"   # 12:00 IST: backup; waits for the main run, resumes if it died
  workflow_dispatch:

concurrency:
  group: intraday-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Paper trade until the close
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          # save state every 10 minutes so a later job can pick up an open position
          ( while sleep 600; do bash .github/save-state.sh "intraday paper" || true; done ) &
          python -m fno_alert.intraday.live --mode paper
      - name: Save state
        if: always()
        run: bash .github/save-state.sh "intraday paper"
