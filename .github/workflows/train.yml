name: Train model

# Builds the research tables from the Upstox history (history-data branch),
# runs the walk-forward backtest, fits the final model and commits
# models/ and reports/BACKTEST.md to main. The live scanner picks the model up
# on its next run.

on:
  workflow_dispatch:

concurrency:
  group: fno-scan   # same group as the scan, so they never push state at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the downloaded history
        run: |
          git fetch --depth 1 origin history-data
          git worktree add data/upstox FETCH_HEAD
      - name: Build tables
        run: python -m fno_alert build-data --upstox data/upstox --workers 4
      - name: Backtest and train
        run: python -m fno_alert train
      - name: Give the live scanner the history (IV rank, OI z-scores)
        run: python -m fno_alert seed-state --options-only
      - name: Save model, report and state
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "fno-alert-bot@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r models reports /tmp/out/
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/out/models /tmp/out/reports .
            python -m fno_alert seed-state --options-only
            git add models/ reports/ state/
            git diff --cached --quiet || git commit -q -m "Train model on Upstox history $(date -u +%F)"
            if git push -q origin main; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1
