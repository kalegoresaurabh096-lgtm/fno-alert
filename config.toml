# F&O big-move alert settings

[universe]
# Stocks to never alert on (NSE symbols)
exclude = []

[alerts]
intraday = true             # also send early (not backtested) intraday estimates
max_per_email = 10          # most alerts in one email
cooldown_hours = 20         # do not repeat the same stock + action within this window
# Used only until a model has been trained (python -m fno_alert train):
fallback_rule_threshold = 0.45

[backtest]
min_turnover_cr = 10.0      # skip stock-days with < Rs 10 crore average daily turnover
holdout_frac = 0.4          # last 40% of the out-of-sample period is the untouched holdout
target_lift = 2.5           # alert threshold must make big moves >= 2.5x more likely than random
min_alerts_per_day = 0.3
max_alerts_per_day = 5.0     # average cap, so the inbox stays readable
