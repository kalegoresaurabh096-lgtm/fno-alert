# F&O big-move alert settings

[universe]
# Stocks to never alert on (NSE symbols)
exclude = []

[alerts]
intraday = true             # also send early (not backtested) intraday estimates
max_per_email = 10          # most alerts in one email
cooldown_hours = 20         # do not repeat the same stock + action within this window
# Used only until a model has been trained (python -m fno_alert train):
fallback_rule_threshold = 0.45

[backtest]
min_turnover_cr = 10.0      # skip stock-days with < Rs 10 crore average daily turnover
holdout_frac = 0.4          # last 40% of the out-of-sample period is the untouched holdout
target_lift = 2.5           # alert threshold must make big moves >= 2.5x more likely than random
min_alerts_per_day = 0.3
max_alerts_per_day = 5.0     # average cap, so the inbox stays readable

[paper]
# Automatic paper trading of the emailed ideas (state/paper/trades.csv)
capital = 500000            # starting paper capital, Rs
max_trade_pct = 0.10        # one trade may cost at most 10% of capital (a stock straddle lot is ~Rs 38k)
max_open_pct = 0.50         # keep at least half the capital unused at all times

[momentum]
# Monthly 12-1 momentum picks (emailed on the first trading day of each month, paper-traded)
top_n = 30                  # hold the 30 F&O stocks with the best 12-1 month return
capital = 500000            # paper capital, Rs (delivery, not F&O)
min_turnover_cr = 10.0      # skip thinly traded stocks

[intraday]
# Intraday option selling (fno_alert/intraday/rules.py). The backtest, the paper run and
# live trading all read these numbers.
# 2026-11-06: switched to the setup found by research/intraday_search.py (chosen on
# Oct 2024-Oct 2025, holdout Nov 2025-Nov 2026 +2.3%). Saurabh's original hedged rules
# (09:45 entry, 1 day before expiry too, 100-pt wings) lost money: reports/intraday/variants.csv.
underlyings = ["NIFTY"]      # paper run trades NIFTY only (SENSEX was flat in the backtest)
capital = 500000
risk_pct = 0.02             # rule 1: planned loss per trade at most 2% of capital
daily_loss_pct = 0.02       # rule 8: stop for the day after losing 2%
max_trades_per_day = 1
hedged = false              # stop-loss instead of a hedge (Saurabh's choice); stops can fill worse
wing = { NIFTY = 100, SENSEX = 300 }
short_delta = 0.20
take_profit = 0.50          # rule 7: exit at 50% of the premium
stop_mult = 1.0             # exit when the loss equals the premium collected
entry_time = "11:30"
last_entry_time = "13:30"
exit_time = "15:15"         # rule 9: flat by 15:15, nothing overnight
max_dte = 0                 # expiry day only
gap_max_pct = 1.0           # rule 5 no-trade filters
vix_max = 22.0
or_max_pct = 0.9

[intraday_live]
# Live trading through Upstox. OFF. It also needs LIVE_TRADING and UPSTOX_TRADING_TOKEN
# set in the environment (see fno_alert/intraday/broker.py). Only Saurabh turns this on.
enabled = false
max_lots = 1                # hard cap on lots per trade while live trading is new

[desk]
# Multi-strategy desk (fno_alert/desk/): several strategies on one Rs 5L paper account
# under one risk engine. Paper only. Live trading stays OFF ([intraday_live] above).
strategies = ["strangle", "condor"]   # strangle uses the [intraday] numbers above

[desk.risk]
capital = 500000
daily_loss_pct = 0.02        # account down 2% today (booked + open): nothing new today, close what daily_closes says
daily_closes = "unhedged"    # the daily limit closes the stop-loss strangle but leaves the wing-capped condor
                             # to its own exit ("all" closed it at intraday lows 3 times: desk +16.9k instead of +43.6k)
monthly_loss_pct = 0.06      # account down 6% from the month's start: close all, pause until resumed by hand
max_margin_frac = 0.80       # all open positions together use at most 80% of capital as margin
max_trade_loss_pct = { strangle = 0.025, condor = 0.08 }   # planned loss of one trade, share of capital
                             # (the condor's loss is capped by its wings: 1 lot of 500-point wings risks ~7%)
auto_pause_mult = 1.5        # pause a strategy whose drawdown passes 1.5x its worst backtest drawdown
block_event_days = true      # no new position on an event day (fno_alert/intraday/events.csv)
confirm_checks = 2           # a loss limit must hold on 2 checks in a row before it closes everything
kill_switch = false          # true = close everything and open nothing (or create state/desk/KILL)

[desk.condor]
# Weekly NIFTY iron condor (research/nifty_condor.py: 0.10 delta, 500-point wings,
# 7 days before expiry, closed the session before expiry: +3.5%/yr per lot in the daily test)
dte_days = 7
short_delta = 0.10
wing = 500
lots = 1
entry_time = "15:20"
exit_time = "15:20"
stop_loss_pct = 0.0          # 0 = no stop, the wings cap the loss
slippage = 0.01
